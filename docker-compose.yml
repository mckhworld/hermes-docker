services:
  hermes-agent:
    image: nousresearch/hermes-agent:main
    container_name: hermes_agent_sandbox
    restart: unless-stopped
    command: ["hermes", "gateway", "run", "--accept-hooks"]
    volumes:
      - ./hermes_data:/opt/data
    environment:
      - WORKSPACE_DIR=/workspace
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
    ports:
      - "127.0.0.1:9119:9119"
    extra_hosts:
      - "host.docker.internal:host-gateway"
